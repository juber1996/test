name: CI

# Runs on every push and every pull request. Vercel deploys independently —
# this workflow is the "did I break it?" check that shows up as a green tick
# next to your commit on GitHub.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` installs exactly what package-lock.json says — which is why
        # that file must be committed.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
